orchestrator_task:
  description: |
    使用中文输出，
    你是全流程的调度大脑。接收以下原始输入：{raw_input}

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略）：
    {supplement}

    本系统已内置固定流水线（10 步）：
    1 执行计划(orchestrator) → 2 需求收集 → 3 需求分析 → 4 优先级评估 → 5 方案设计(PRD)
    → 6 技术可行性 → 7 原型设计 → 8 价值叙事 → 9 排期规划 → 10 复盘
    其中第 9 步（排期规划）之前必须通过人工评审 gate。

    请输出本次执行的执行计划：说明每一步的输入/输出产物、数据依赖关系，
    并对原始输入做初步判断（属于新需求/需求变更/复盘诉求/信息补充）。

  expected_output: |
    使用中文输出，
    执行计划（Markdown），包含：
    - 输入类型判断：新需求 / 需求变更 / 复盘诉求 / 信息补充
    - 步骤执行清单（每步：输入产物 → 输出产物）
    - 关键依赖与注意事项

requirement_collection_task:
  description: |
    使用中文输出，
    接收以下原始需求材料：{raw_input}

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略，合并进对应条目）：
    {supplement}

    作为需求收集师，请：
    1. 逐条编号（R-001、R-002...），记录每条诉求的来源
    2. 去除重复与噪音条目：合并重复表述，剔除纯情绪、无明确诉求的内容（标注剔除原因）
    3. 按标签体系归类：功能 / 体验 / 性能 / 合规 / 内部工具 / 其他
    4. 输出需求池清单

  expected_output: |
    使用中文输出，
    需求池清单（Markdown 表格），每条包含：
    | 编号 | 一句话摘要 | 来源 | 标签 | 收集日期 |
    |------|-----------|------|------|----------|
    另附：剔除条目及原因说明；来自补充信息的内容同样纳入编号与归类。

requirement_analysis_task:
  description: |
    使用中文输出，
    接收以下需求池清单（来自需求收集步骤）：{input_data}。
    从中提取关键结构化信息，识别用户角色、使用场景、核心痛点、期望诉求、诉求频次及紧急程度。
    将非结构化的原始文本转化为统一的、字段完整的需求卡片格式。
    不要做任何假设，仅基于输入内容中明确提及或可直接推断的信息进行提取。

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为缺失字段的补充依据，据实更新卡片字段）：
    {supplement}

    【处理步骤】
    1. 用户角色识别：从对话中提取用户身份（如客服主管/运营人员/终端用户/决策者）及用户画像特征
    2. 使用场景还原：还原用户遇到问题的具体场景（时间、地点、触发条件、当前解决方案）
    3. 痛点提炼：精准表述用户核心痛点——用户在用现有方案时"卡"在哪一步，造成了什么负面影响
    4. 诉求归纳：明确用户想要什么（功能需求/性能需求/体验需求），区分显性诉求与隐性诉求
    5. 频次与紧急度判断：评估问题发生频率（高/中/低）和紧急程度（高/中/低），基于原文依据进行标注
    6. 去噪与结构化：去除情绪化表达、重复内容、无关信息，按统一Schema输出结构化数据
    7. 信息完整性校验：检查需求卡片是否有缺项，如关键信息缺失则输出"待补充清单"（若补充信息已覆盖某缺失项，则据实更新卡片字段）
    8. 输出：先输出 Markdown 卡片，再在 ```json 代码块中输出机器可读结构

  expected_output: |
    使用中文输出，
    结构化需求卡片，包含以下字段：
    - 用户角色：xxx
    - 使用场景描述：xxx
    - 痛点描述：xxx
    - 期望诉求：xxx
    - 诉求频次：高/中/低
    - 紧急程度：高/中/低
    - 原始对话摘要：xxx
    - 信息完整性校验：通过/待补充（如为"待补充"，附缺失字段清单，并注明哪些缺失项已由补充信息覆盖）

    并在最后附 ```json 代码块（字段：user_role, scenario, pain_point, expectation, frequency, urgency, summary, completeness, missing_fields）

requirement_evaluation_task:
  description: |
    使用中文输出，
    基于以下需求卡片：{requirement_card}。
    对需求进行真伪甄别、价值量化，输出有据可依的优先级排序。

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，评估对象以补充后的需求为准）：
    {supplement}

    【评估维度】
    1. 真伪需求甄别：判断需求是否真实存在（排除用户随口一提、偶发性抱怨、已有替代方案的伪需求）
    2. 用户影响面评估：评估该需求影响的用户范围（覆盖用户数/占比/用户层级/用户价值敏感度）
    3. 商业价值量化：评估需求带来的商业收益（潜在收入增长/成本节约/品牌价值/合规要求）
    4. 实现成本预估：结合历史经验，评估实现该需求的综合成本（开发/运维/培训）
    5. 优先级综合评分：基于评估模型（影响面×频次×商业权重-成本）输出P0/P1/P2优先级标签及评分明细
    6. 历史需求对比：与需求池中已有/已实现需求进行相似度对比，评估是重复需求还是独立新需求
    7. 决策逻辑文档化：为每个优先级判断输出清晰的文字理由，确保可追溯、可复盘

    【优先级定义】
    - P0：核心价值闭环，不做严重影响业务，必须立即投入
    - P1：重要功能，显著提升体验或效率，应在近期排期
    - P2：锦上添花，有替代方案或非紧急，可后续迭代

    评估必须基于明确标准，不可凭主观偏好。

  expected_output: |
    使用中文输出，
    优先级评估报告，包含：
    - 优先级标签：P0/P1/P2
    - 综合评分：xx分（满分100）
    - 各维度得分明细：
      - 用户影响面：xx分
      - 诉求频次：xx分
      - 商业价值权重：xx分
      - 实现成本：xx分
    - 评估理由说明：xxx
    - 历史需求对比参照：xxx（如有相似需求）

solution_design_task:
  description: |
    使用中文输出，
    基于通过评估的高优先级需求（P0/P1），调用产品需求模板库和经验模式，
    输出包含功能逻辑、用户操作路径、异常边界条件及MVP范围界定在内的产品方案初稿。

    【输入参数】
    - 需求卡片：{requirement_card}
    - 优先级报告：{priority_report}
    - 执行计划（供参考）：{execution_plan}
    - 需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，功能清单需覆盖其中的新增点）：
      {supplement}

    【设计步骤】
    1. 功能清单拆解：将需求拆解为具体功能点列表，每个功能点包含名称、描述、类型（新增/修改/删除）
    2. 用户操作路径设计：设计用户从触发到完成目标的完整操作流程（含主要路径、替代路径、退出路径）
    3. 前置/后置条件定义：明确每个功能或操作步骤的前置条件（用户状态/权限/数据准备）和后置结果（数据变更/状态跳转）
    4. 异常边界梳理：识别所有可能的异常分支（网络异常/数据异常/权限异常/并发冲突）及对应的处理方式
    5. MVP范围界定：明确标注哪些功能属于MVP必需（核心价值闭环），哪些属于后续迭代增强
    6. 功能架构图生成：同步产出Mermaid格式的功能架构图（mindmap或flowchart）
       - 以用户需求为中心，展开所有功能模块
       - 区分MVP功能（标记为绿色）和迭代功能（标记为橙色）
       - 标注模块之间的依赖关系
    7. 模板复用与适配：调用历史需求模板库，快速套用相似场景的方案结构，提升设计效率

    此任务旨在将需求转化为可直接用于技术沟通和PRD润色的设计蓝图。

  expected_output: |
    使用中文输出，
    关于该需求的产品方案初稿（PRD草稿），包含以下内容：

    【一、功能清单】
    | 功能名称 | 功能描述 | 类型（新增/修改/删除） | 优先级标签 |
    |----------|----------|------------------------|------------|
    | xxx      | xxx      | xxx                    | P0/P1/P2   |

    【二、用户操作路径】
    - 主要路径：步骤1 → 步骤2 → 步骤3 → 目标达成
    - 替代路径：xxx
    - 退出路径：xxx

    【三、前置条件与后置结果】
    - 前置条件：xxx
    - 后置结果：xxx

    【四、异常边界及处理方式】
    | 异常类型 | 触发条件 | 处理方式 |
    |----------|----------|----------|
    | xxx      | xxx      | xxx      |

    【五、MVP范围界定】
    - MVP必需功能：xxx
    - 后续迭代功能：xxx

    【六、功能架构图（Mermaid格式）】
    ```mermaid
    mindmap
      root((系统名称))
        模块A
          功能1
          功能2
        模块B
          功能1
          功能2
    ```

technical_feasibility_task:
  description: |
    使用中文输出，
    基于以下 PRD 初稿：{prd_draft}

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，可行性评估需将其纳入考虑）：
    {supplement}

    作为技术桥接师，请输出技术可行性评估：

    【评估步骤】
    1. 可行性结论：给出 可行 / 有条件可行 / 不可行 的结论及理由
    2. 涉及模块梳理：方案涉及的已有系统模块、需新增的组件或服务
    3. 第三方依赖审核：第三方服务、API、开源组件及其风险（成熟度/成本/合规）
    4. 技术风险预警：性能瓶颈/安全漏洞/数据一致性/兼容性问题及应对建议
    5. 工作量预估：输出分模块人天预估表，每个模块必须给出具体人天数值。
       注意：此处人天口径与后续排期步骤的估时口径保持一致（1人天=1人×8小时有效工作）。

  expected_output: |
    使用中文输出，
    技术可行性评估报告，包含：
    - 可行性结论：xxx（可行/有条件可行/不可行）及理由
    - 涉及模块清单（表格：模块名 | 已有/新增 | 说明）
    - 第三方依赖分析（表格：依赖项 | 用途 | 风险等级 | 替代方案）
    - 分模块工作量预估表（表格：模块名 | 人天 | 说明）
    - 技术风险与应对（列表）

prototype_design_task:
  description: |
    使用中文输出，
    基于以下 PRD 初稿：{prd_draft}

    另附需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，原型页面与交互需覆盖其中的新增点）：
    {supplement}

    作为原型设计师，请产出三部分：

    【一、原型规格文档】
    1. 页面清单：页面名、目的、入口来源、去向导航
    2. 组件清单：组件名、类型（按钮/输入框/卡片/弹窗等）、状态（默认/悬停/禁用）、是否复用
    3. 交互说明：操作（点击/输入/切换）→ 触发条件 → 系统反馈（跳转/弹层/状态变化）
    4. 文案清单：文案内容、出现位置、语气说明（与 PRD 功能点一一对应）

    【二、单文件 HTML 低保真原型】
    - 内嵌 CSS/JS，零外部依赖（不引用任何 CDN）
    - 灰阶配色 + 占位样式，突出布局与流程
    - 页面间可跳转（同一文件内的多个页面视图切换）
    - 核心交互可演示：点击切换状态、表单输入、弹窗开关
    - 完整 HTML 放在一个 ```html 代码块中，浏览器打开即可用
    - 【长度控制】只实现 3-4 个核心页面（入口 → 列表 → 详情/弹窗），样式极简，
      总代码控制在 400 行以内；HTML 放在输出末尾，代码块必须用 ``` 闭合

    【三、评审检查单】
    - 检查原型是否覆盖 PRD 全部功能点，逐项勾选

  expected_output: |
    使用中文输出，
    原型规格文档（Markdown，四节：页面清单/组件清单/交互说明/文案清单）
    + 一个 ```html 代码块（完整单文件低保真原型）
    + 评审检查单

value_narration_task:
  description: |
    使用中文输出，
    基于以下材料：
    - PRD 初稿：{prd_draft}
    - 优先级报告：{priority_report}
    - 技术可行性报告：{feasibility_report}
    - 需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，决策简报需以补充后的需求为准）：
      {supplement}

    作为价值叙事师，请将方案转化为面向管理层/客户的一页纸决策简报。
    该简报将作为需求评审会的演示材料，须用商业语言而非技术语言，
    让决策者 3 分钟内看懂"为什么做、值不值得做"。

    【输出要求】
    1. 价值主张：一句话说清为什么做这件事
    2. 预期收益量化：尽量给出可量化指标（提升x%/节省y/缩短z），无法量化则给出定性说明
    3. 成本收益：结合可行性报告的工作量与成本预估做 ROI 说明
    4. 战略对齐：与公司/部门目标的关系
    5. 风险说明：管理层视角的主要风险与应对（不展开技术细节）
    6. 决策建议：立即推进 / 暂缓 / 不推进，附理由

  expected_output: |
    使用中文输出，
    一页纸决策简报，包含：价值主张、预期收益量化、成本收益(ROI)、战略对齐、
    风险与应对、决策建议（立即推进/暂缓/不推进+理由）

schedule_planning_task:
  description: |
    使用中文输出，
    输入材料：
    - PRD 初稿：{prd_draft}
    - 技术可行性报告：{feasibility_report}
    - 团队资源假设：{team_config}
    - 需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为在原始需求基础上追加的最新要求，WBS 需覆盖其中的新增点）：
      {supplement}

    作为排期规划师，请按以下步骤输出排期：

    【处理步骤】
    1. WBS 拆解：将 PRD 功能清单拆解为任务，任务粒度 0.5-3 人天。
       任务必须覆盖 PRD 全部功能点，并包含测试、联调、验收任务
    2. 估时：继承可行性报告的分模块人天，落到每个任务。
       若总人天与可行性报告总量偏差超过 20%，必须在风险项中说明原因
    3. 依赖分析：为每个任务标注前置依赖（任务ID列表），识别关键路径，保证依赖无环
    4. 资源排布：结合团队资源假设（人数/开始日期/迭代周期），把任务排到具体起止日期
    5. 验收清单：每个任务一条可验证的验收标准

    【输出格式】
    1. 排期表（Markdown 表格：任务ID | 任务名 | 模块 | 依赖 | 人天 | 起止日期 | 负责人角色 | 验收标准）
    2. 一个 ```json 代码块，机器可读结构：
       {"wbs_items": [{"id","name","module","depends_on","estimate_days","assignee_role","acceptance_criteria"}],
        "milestones": [{"name","date","items"}], "critical_path": ["T-001",...], "risks": [...]}
    3. 一个 ```mermaid 代码块，gantt 类型甘特图（dateFormat YYYY-MM-DD，按任务排日期）
    4. 关键路径说明与风险项

  expected_output: |
    使用中文输出，
    排期表（Markdown 表格）+ ```json 代码块（wbs_items/milestones/critical_path/risks）
    + ```mermaid 甘特图（gantt 类型）+ 关键路径说明 + 风险项 + 验收清单

retrospective_task:
  description: |
    使用中文输出，
    输入材料：
    - 排期表（预期）：{schedule_plan}
    - 研发过程记录：{dev_status}
    - 验收记录：{acceptance_result}
    - 上线数据：{post_launch_data}
    - 用户反馈：{feedback_data}
    - 需求补充信息（如为「(未提供)」或「暂无补充记录」则忽略；如有实际内容，视为需求执行期间的追加要求，复盘时纳入迭代建议考虑）：
      {supplement}

    作为追踪复盘师，请：

    【处理步骤】
    1. 对用户反馈调用「情感分析工具」做情感分析（如工具不可用则人工判断情感倾向）
    2. 输出状态流转时间线：评审→开发→验收→上线 的预期 vs 实际日期
    3. 里程碑达成表：逐里程碑标注 达成/延期/未达成 + 原因
    4. 预期vs实际对比：需求卡片与决策简报中的预期指标 vs 上线数据
    5. 归因分析：从 需求理解偏差/方案设计缺陷/技术实现问题/资源不足/外部依赖 中定位原因，给出证据链
    6. 迭代建议：明确 继续优化/调整方向/暂停投入 + 可执行行动项（含负责人角色与预计人天）

    【数据纪律】
